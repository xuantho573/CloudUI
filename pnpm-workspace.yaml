packages:
  - apps/*
  - packages/*

allowBuilds:
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  react: 19.3.0
  react-dom: 19.3.0
  typescript: ^6.0.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@module-federation/runtime": 2.9.0
  "@module-federation/vite": ^1.21.6
  vue: ^3.5.42
  vue-tsc: ^3.3.11
  "@vue/tsconfig": ^0.9.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
